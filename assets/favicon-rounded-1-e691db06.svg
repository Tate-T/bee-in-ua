    <!-- Дах -->
    <path d="M36 42 L60 28.5 L84 42"/>
    <!-- Перемичка під дахом із фірмовим розривом праворуч -->
    <line x1="41" y1="42" x2="71.5" y2="42"/>
    <line x1="77.5" y1="42" x2="79" y2="42"/>

    <!-- Верхній корпус -->
    <rect x="42" y="42" width="36" height="12.5" rx="2"/>
    <!-- Середній корпус -->
    <rect x="42" y="54.5" width="36" height="12.5" rx="2"/>
    <!-- Нижній корпус -->
    <rect x="42" y="67" width="36" height="11.5" rx="2"/>

    <!-- Круглий льоток по центру -->
    <circle cx="60" cy="67" r="4.5" fill="#FFFFFF" stroke="#F5B818" stroke-width="4"/>

    <!-- Дві ніжки вулика -->
    <path d="M47 78.5 L44.5 85.5 L50.5 85.5 L52 78.5"/>
    <path d="M68 78.5 L69.5 85.5 L75.5 85.5 L73 78.5"/>
  </g>

  <!-- Заокруглена платформа ваг -->
  <g>
    <!-- Ніжки ваг -->
    <rect x="42" y="93.5" width="7.5" height="4" rx="2" fill="#2B2E36"/>
    <rect x="70.5" y="93.5" width="7.5" height="4" rx="2" fill="#2B2E36"/>
    <!-- Основна платформа -->
    <rect x="35" y="85.5" width="50" height="8.5" rx="4.25" fill="#2B2E36"/>
    <!-- Жовтий індикатор по центру -->
    <rect x="57" y="88.5" width="6" height="2.5" rx="1.25" fill="#F5B818"/>
  </g>
</svg>
