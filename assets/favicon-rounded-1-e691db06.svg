<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 5 102 110" width="64" height="64" fill="none">
  
  <!-- Заокруглений жовтий шестикутник -->
  <path d="M55 8.5 Q60 5.6 65 8.5 L103 30.4 Q108 33.3 108 39.1 L108 80.9 Q108 86.7 103 89.6 L65 111.5 Q60 114.4 55 111.5 L17 89.6 Q12 86.7 12 80.9 L12 39.1 Q12 33.3 17 30.4 Z"
        stroke="#F5B818" stroke-width="5.2" stroke-linejoin="round"/>

  <!-- Вулик (стандарт логотипа BeeHAPPY) -->
