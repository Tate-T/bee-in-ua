<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./img/favicon-rounded-1.svg" />
    <title>Авторизація — BeeHAPPY</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="auth-container cabinet-page">
        <div class="auth-card u-card">
            <div class="auth-yellow-line"></div>
    
            <h1 class="auth-title">Авторизація</h1>
            <p class="auth-subtitle">Введіть свої дані для входу до особистого кабінету BeeHAPPY</p>
            
            <form action="#" method="POST" class="auth-form">
                <div class="form-field">
                    <label for="login-email" class="u-form-label">E-mail адреса</label>
                    <input type="email" id="login-email" name="email" class="u-form-input" placeholder="example@bee.in.ua" required>
                </div>
    
                <div class="form-field">
                    <label for="login-password" class="u-form-label">Пароль</label>
                    <input type="password" id="login-password" name="password" class="u-form-input" placeholder="Введіть пароль" required>
                </div>
    
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Запам'ятати мене
                    </label>
                    <a href="#" class="forgot-pass-link">Забули пароль?</a>
                </div>
    
                <button type="submit" class="btn-submit-reg u-btn">Увійти</button>
            </form>
    
            <div class="auth-footer">
                <div class="auth-switch-text">
                    Ще не зареєстровані? <a href="./register.html" class="auth-link">Зареєструватися</a>
                </div>
                
                <a href="./index.html" class="auth-logo-link" title="На головну">
                    <img src="./img/fon/logo-beehappy.webp" alt="BeeHAPPY" class="auth-footer-logo">
                </a>
            </div>
        </div>
    </main>
    <script type="module" src="/main.js"></script>
</body>
</html>
