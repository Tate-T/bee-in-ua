<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/cabinet.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <!-- Жовта смуга, як у контактах та реєстрації -->
            <div class="auth-yellow-line"></div>
    
            <h1 class="auth-title">Авторизація</h1>
            <p class="auth-subtitle">Введіть свої дані для входу до особистого кабінету BeeHAPPY</p>
            
            <form action="#" method="POST" class="auth-form">
                <!-- Поле: Email -->
                <div class="form-field">
                    <label for="login-email">E-mail адреса</label>
                    <input type="email" id="login-email" name="email" placeholder="example@bee.in.ua" required>
                </div>
    
                <!-- Поле: Пароль -->
                <div class="form-field">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" name="password" placeholder="Введіть пароль" required>
                </div>
    
                <!-- Додаткові лінки: Запам'ятати мене та Забули пароль -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Запам'ятати мене
                    </label>
                    <a href="#" class="forgot-pass-link">Забули пароль?</a>
                </div>
    
                <!-- Кнопка увійти -->
                <button type="submit" class="btn-submit-reg">Увійти</button>
            </form>
    
            <!-- Нижній блок з посиланням на реєстрацію та логотипом -->
            <div class="auth-footer">
                <div class="auth-switch-text">
                    Ще не зареєстровані? <a href="./register.html" class="auth-link">Зареєструватися</a>
                </div>
                
                <!-- Логотип, що перекидає на головну сторінку -->
                <a href="./index.html" class="auth-logo-link" title="На головну">
                    <img src="https://bee.in.ua/bootstrap/img/logo.png" alt="BeeHAPPY" class="auth-footer-logo">
                </a>
            </div>
        </div>
    </main>
    <script type="module" src="/main.js"></script>
</body>
</html>
