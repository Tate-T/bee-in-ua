<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо веб-кабінет — BeeHAPPY</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/demo.css">
</head>

<body>
    <load ="partials/header.html" />

    <main class="main-content">
        <section class="demo-section">
            <a class="demo-link hive-assembly" href="https://bee.in.ua/uk/window/286" target="_blank" rel="noopener noreferrer" title="Натисніть, щоб відкрити демо веб-кабінету">
                
                <!-- Верхній рівень: Вулична температура та GSM антена -->
                <div class="hive-top-bar">
                    <div class="outdoor-badge">
                        <span>☀️ Вулиця: <strong>23.5°C</strong></span>
                    </div>
                    <div class="antenna-unit">
                        <span class="gsm-badge">📶 GSM: <strong>52%</strong></span>
                        <div class="antenna-rod"></div>
                    </div>
                </div>

                <!-- Дах вулика -->
                <div class="hive-cap">
                    <div class="cap-metal-rim"></div>
                    <span class="cap-label">BeeHAPPY • ВН-1</span>
                </div>

                <!-- Верхній корпус: Температура та вологість всередині -->
                <div class="hive-tier tier-super">
                    <div class="tier-handle left"></div>
                    <div class="tier-content">
                        <div class="data-pill indoor">
                            <span class="pill-title">🌡️ Всередині вулика</span>
                            <div class="pill-values">
                                <span><strong>23°C</strong> <small>(23.02°)</small></span>
                                <span class="divider">|</span>
                                <span><strong>52.6%</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="tier-handle right"></div>
                </div>

                <!-- Нижній корпус: АКБ, Баланс та льоток -->
                <div class="hive-tier tier-brood">
                    <div class="tier-handle left"></div>
                    <div class="tier-content">
                        <div class="system-row">
                            <div class="sys-box battery">
                                <span class="sys-name">🔋 АКБ</span>
                                <span class="sys-val">88%</span>
                            </div>
                            <div class="sys-box balance">
                                <span class="sys-name">💰 Баланс</span>
                                <span class="sys-val">8 грн</span>
                            </div>
                        </div>
                        <div class="hive-entrance-unit">
                            <div class="entrance-slot"></div>
                            <div class="landing-board"></div>
                        </div>
                    </div>
                    <div class="tier-handle right"></div>
                </div>

                <!-- Вагова платформа з тензодатчиками -->
                <div class="weighing-platform">
                    <div class="platform-deck">
                        <div class="weight-display">
                            <div class="weight-main">
                                <span class="weight-label">⚖️ Вага</span>
                                <span class="weight-num">2.00 <small>кг</small></span>
                            </div>
                            <div class="weight-daily">
                                <span class="daily-label">📈 Доба</span>
                                <span class="daily-num">0.00 кг</span>
                            </div>
                        </div>
                        <div class="cta-strip">Перейти до демо веб-кабінету →</div>
                    </div>
                    <div class="platform-feet">
                        <div class="load-cell"></div>
                        <div class="load-cell"></div>
                    </div>
                </div>

            </a>
        </section>
    </main>

    <load ="partials/footer.html" />
    <script type="module" src="/main.js"></script>
</body>

</html>
